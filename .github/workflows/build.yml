name: Build installers

on:
  pull_request:
    paths-ignore: ['**/*.md', 'test/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A published release first sets the app's version from its tag and adds its notes to
  # CHANGELOG.md (scripts/prepare-release.js), so the installers and the app's What's new
  # match it. Pull requests skip this and only build.
  prepare:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # main is protected (changes only through pull requests with passing tests), and GitHub's own
      # Actions token can't skip that on a personal repository. The release pushes its version commit
      # with a deploy key instead: secret RELEASE_DEPLOY_KEY, a key with write access that the
      # "Protect main" ruleset lists under Bypass. See README > Making a release.
      # Checked first, with a message that says what's wrong: missing, not a usable private key
      # (e.g. the .pub file was pasted, or the key has a passphrase), or not accepted by GitHub.
      - name: Check the release key
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          fail() { echo "::error title=Release key::$1"; exit 1; }
          [ -n "$KEY" ] || fail "The RELEASE_DEPLOY_KEY secret is missing. Without it the release can't save its version to main (see README > Contributing and releases)."
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/release_key   # Windows line endings break OpenSSH
          chmod 600 ~/.ssh/release_key
          if ! ssh-keygen -y -P '' -f ~/.ssh/release_key > ~/.ssh/release_key.pub 2> ~/.ssh/err; then
            fail "RELEASE_DEPLOY_KEY isn't a usable private key ($(tr '\n' ' ' < ~/.ssh/err)). Paste the whole release_key file (the one without .pub), from -----BEGIN to -----END-----, made without a passphrase."
          fi
          FP=$(ssh-keygen -lf ~/.ssh/release_key.pub | awk '{print $2}')
          echo "::notice title=Release key::Fingerprint $FP. It should match the deploy key in Settings > Deploy keys."
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          out=$(ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o BatchMode=yes -T git@github.com 2>&1 || true)
          echo "$out" | grep -q "successfully authenticated" \
            || fail "GitHub doesn't accept the release key (fingerprint $FP): $out. Add its public key (release_key.pub) under Settings > Deploy keys, with Allow write access."
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # pushes (the version commit and the tag) go over SSH with the release key
      - name: Push with the release key
        run: git remote set-url --push origin "git@github.com:${{ github.repository }}.git"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # For the quick tests below: they load Electron, which downloads its binary on first use.
      - run: npm ci
      - run: npx --no install-electron

      - name: Check the release was made from the latest main
        run: |
          TAG_SHA=$(git rev-list -n 1 "${{ github.event.release.tag_name }}")
          MAIN_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::The release tag points at $TAG_SHA but main is at $MAIN_SHA. Create the release from the latest main."
            exit 1
          fi

      - name: Set the version and update CHANGELOG.md
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          node scripts/prepare-release.js "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/notes.md"

      - name: Run the quick tests on the release
        run: npm test

      - name: Commit to main and move the tag
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing to change."
          else
            git config user.name "${{ github.event.release.author.login }}"
            git config user.email "${{ github.event.release.author.id }}+${{ github.event.release.author.login }}@users.noreply.github.com"
            git commit -am "Release ${{ github.event.release.tag_name }}"
            git push origin HEAD:main || { echo "::error title=Couldn't save the version to main::The push was refused. Check that the release deploy key has write access and is on the Protect main ruleset's bypass list."; exit 1; }
            git tag -f "${{ github.event.release.tag_name }}"
            git push -f origin "refs/tags/${{ github.event.release.tag_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.os }})
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Import the signing certificate (macOS, optional)
        if: runner.os == 'macOS' && env.MAC_CERT_P12 != ''
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          # Stays unlocked for the whole build (by default it locks itself after 5 minutes).
          security set-keychain-settings build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          # Not just "valid" (trusted) identities: a self-signed certificate works too, and keeps
          # one signature from release to release, so installed copies can update themselves.
          IDENTITY=$(security find-identity -p codesigning build.keychain | grep -m1 -o '"[^"]*"' | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "::error title=Signing certificate::MAC_CERT_P12 has no code-signing identity"; exit 1; }
          echo "::notice title=Signing certificate::Signing with \"$IDENTITY\""
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=build.keychain" >> "$GITHUB_ENV"
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder@25.1.8 ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: gh release upload "${{ github.event.release.tag_name }}" out/*/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
