name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron 44 downloads its binary the first time it's loaded. Doing it once here stops test files
      # that load it at the same time from racing (on Windows two unpacks into one folder fail).
      - run: npx --no install-electron
      - run: npm test

  app:
    name: App and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no install-electron
      - run: npm run test:setup
      - name: Coverage (unit) with per-file minimums
        run: npm run test:coverage
      - name: Launch tests (real app, demo mode, hidden and muted)
        # A screen bigger than the test window, in full colour (xvfb-run's default is small and 8-bit).
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" npm run test:launch
