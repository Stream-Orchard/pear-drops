name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Mondays: the dependency audit alone, for holes found since the last change.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Known holes in the packages the app installs (npm audit), at moderate or worse.
  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

  unit:
    if: github.event_name != 'schedule'
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron 44 downloads its binary the first time it's loaded. Doing it once here stops test files
      # that load it at the same time from racing (on Windows two unpacks into one folder fail).
      - run: npx --no install-electron
      - run: npm test

  app:
    if: github.event_name != 'schedule'
    name: App and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no install-electron
      - name: Coverage (unit) with per-file minimums
        run: npm run test:coverage
      - name: Launch tests (real app, demo mode, hidden and muted)
        # A screen bigger than the test window, in full colour (xvfb-run's default is small and 8-bit).
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" npm run test:launch
